
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEM v2.5</title>

<style>
:root {
    --green: #b5ff00;
    --yellow: #eaff00;
    --white: #ffffff;
    --bg: #090d09;
    --panel: #111811;
    --border: #293629;
    --muted: #899489;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--white);
    font-family: Arial, sans-serif;
    height: 100dvh;
    display: flex;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    width: 245px;
    background: #0d130d;
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 26px;
    font-weight: 900;
    color: var(--green);
    letter-spacing: 2px;
    margin-bottom: 5px;
}

.version {
    font-size: 11px;
    color: var(--yellow);
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.new-chat {
    background: var(--green);
    color: #080d05;
    border: none;
    padding: 13px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.sidebar-label {
    color: var(--muted);
    font-size: 11px;
    margin-top: 30px;
    margin-bottom: 12px;
    letter-spacing: 2px;
}

.history {
    color: #b4beb4;
    font-size: 13px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}

.history:hover {
    background: #1b261b;
}

.sidebar-bottom {
    margin-top: auto;
    color: var(--muted);
    font-size: 12px;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 70px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    flex-shrink: 0;
}

.header-title {
    font-weight: bold;
    letter-spacing: 1px;
}

.status {
    color: var(--green);
    font-size: 12px;
}

.status::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 7px;
    box-shadow: 0 0 8px var(--green);
}

/* CHAT */

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
}

.messages {
    max-width: 780px;
    margin: auto;
}

.welcome {
    text-align: center;
    margin: 90px auto 40px;
}

.welcome-logo {
    font-size: 48px;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 25px #b5ff0055;
}

.welcome h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
}

.suggestions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 30px;
}

.suggestion {
    background: var(--panel);
    color: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 12px;
}

.suggestion:hover {
    border-color: var(--green);
    color: var(--green);
}

/* MESSAGES */

.message {
    display: flex;
    gap: 12px;
    margin: 25px 0;
    align-items: flex-start;
}

.avatar {
    min-width: 34px;
    height: 34px;
    background: var(--green);
    color: #101600;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 13px;
}

.user .avatar {
    background: #e8eddf;
}

.message-content {
    min-width: 0;
    flex: 1;
}

.message-name {
    font-size: 12px;
    color: var(--green);
    font-weight: bold;
    margin-bottom: 8px;
}

.user .message-name {
    color: var(--white);
}

.message-text {
    color: #e2e8df;
    font-size: 14px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

/* INPUT */

.input-section {
    padding: 15px 20px 22px;
    background: linear-gradient(transparent, #090d09 20%);
    flex-shrink: 0;
}

.input-container {
    max-width: 780px;
    margin: auto;
    border: 1px solid #45553c;
    background: #141c13;
    border-radius: 15px;
    padding: 10px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    transition: 0.2s;
}

.input-container:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 15px #b5ff0015;
}

textarea {
    flex: 1;
    background: transparent;
    color: white;
    border: none;
    outline: none;
    resize: none;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    min-height: 40px;
    max-height: 130px;
}

textarea::placeholder {
    color: #788276;
}

.send {
    background: var(--green);
    color: #101600;
    border: none;
    width: 43px;
    height: 43px;
    border-radius: 10px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.send:hover {
    background: var(--yellow);
    box-shadow: 0 0 15px #b5ff0066;
}

.send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.footer-note {
    color: #647064;
    font-size: 10px;
    text-align: center;
    margin-top: 12px;
}

/* MOBILE */

@media(max-width: 650px) {
    .sidebar {
        display: none;
    }

    .header {
        height: 60px;
        padding: 0 15px;
    }

    .chat-area {
        padding: 15px;
    }

    .welcome {
        margin-top: 65px;
    }

    .welcome-logo {
        font-size: 40px;
    }

    .input-section {
        padding: 10px 12px 18px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">
    <div class="logo">LEM.</div>
    <div class="version">VERSION 2.5</div>

    <button class="new-chat" onclick="newChat()">
        + New Chat
    </button>

    <div class="sidebar-label">WORKSPACE</div>

    <div class="history">◈ Current conversation</div>
    <div class="history">⌕ GitHub Knowledge</div>

    <div class="sidebar-bottom">
        LEM v2.5<br>
        <span style="color:var(--green)">●</span>
        <span id="sidebarStatus">Loading database...</span>
    </div>
</aside>

<!-- MAIN -->

<main class="main">

    <header class="header">
        <div class="header-title">
            LEM <span style="color:var(--green)">v2.5</span>
        </div>

        <div class="status" id="connection">
            Loading
        </div>
    </header>

    <!-- CHAT -->

    <section class="chat-area" id="chatArea">
        <div class="messages" id="messages">

            <div class="welcome" id="welcome">
                <div class="welcome-logo">LEM.</div>

                <h1>What can I help you with?</h1>

                <p>
                    LEM v2.5 · GitHub Knowledge Assistant
                </p>

                <div class="suggestions">

                    <button class="suggestion"
                    onclick="suggest('Write me some HTML code')">
                        Create HTML
                    </button>

                    <button class="suggestion"
                    onclick="suggest('Explain how Python works')">
                        Learn Python
                    </button>

                    <button class="suggestion"
                    onclick="suggest('Give me a project idea')">
                        Project ideas
                    </button>

                </div>
            </div>

        </div>
    </section>

    <!-- INPUT -->

    <section class="input-section">

        <div class="input-container">

            <textarea
                id="userInput"
                placeholder="Message LEM..."
                rows="1"
            ></textarea>

            <button class="send"
                id="sendButton"
                onclick="sendMessage()">
                ↑
            </button>

        </div>

        <div class="footer-note">
            LEM v2.5 · Powered by GitHub Knowledge
        </div>

    </section>

</main>

<script>

/* ==================================
   CONFIGURATION
================================== */

const CONFIG = {
    GITHUB_DATA:
    "https://raw.githubusercontent.com/BraxtonDev/CHATBOT/main/data/data.json",

    MAX_RESULTS: 3,
    MAX_MESSAGE_LENGTH: 2000
};

/* ==================================
   CHAT VARIABLES
================================== */

const input = document.getElementById("userInput");
const messages = document.getElementById("messages");
const chatArea = document.getElementById("chatArea");
const sendButton = document.getElementById("sendButton");
const connection = document.getElementById("connection");
const sidebarStatus = document.getElementById("sidebarStatus");

let conversation = [];
let busy = false;
let knowledgeDatabase = null;

/* ==================================
   DATABASE LOADER
================================== */

async function loadDatabase() {

    connection.textContent = "Loading";
    sidebarStatus.textContent = "Loading database...";

    try {

        const response = await fetch(CONFIG.GITHUB_DATA, {
            cache: "no-cache"
        });

        if (!response.ok) {
            throw new Error("GitHub returned " + response.status);
        }

        const data = await response.json();

        if (!data || !Array.isArray(data.content)) {
            throw new Error("Invalid database format");
        }

        knowledgeDatabase = data.content.filter(
            item => typeof item === "string"
        );

        connection.textContent = "GitHub Connected";
        sidebarStatus.textContent =
            knowledgeDatabase.length + " passages loaded";

        console.log(
            "LEM database loaded:",
            knowledgeDatabase.length,
            "passages"
        );

        return true;

    } catch (error) {

        knowledgeDatabase = null;

        connection.textContent = "Database Offline";
        sidebarStatus.textContent = "Database unavailable";

        console.error("Database error:", error);

        return false;
    }
}

/* ==================================
   MESSAGE DISPLAY
================================== */

function addMessage(role, text) {

    document.getElementById("welcome")?.remove();

    const message = document.createElement("div");
    message.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "U" : "L";

    const content = document.createElement("div");
    content.className = "message-content";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = role === "user" ? "YOU" : "LEM";

    const body = document.createElement("div");
    body.className = "message-text";
    body.textContent = text;

    content.appendChild(name);
    content.appendChild(body);

    message.appendChild(avatar);
    message.appendChild(content);

    messages.appendChild(message);

    chatArea.scrollTop = chatArea.scrollHeight;

    return message;
}

/* ==================================
   TEXT PROCESSING
================================== */

function tokenize(text) {

    const ignored = new Set([
        "the", "and", "for", "that", "this",
        "what", "how", "can", "you", "are",
        "does", "with", "from", "tell", "about",
        "have", "has", "was", "were", "will",
        "would", "could", "should", "into",
        "your", "their", "there", "then",
        "please", "explain", "make", "some"
    ]);

    return (text.toLowerCase().match(/[a-z0-9]+/g) || [])
        .filter(word => word.length > 2 && !ignored.has(word));
}

/* ==================================
   SEARCH ENGINE
================================== */

function searchDatabase(query) {

    if (!knowledgeDatabase) {
        return [];
    }

    const keywords = tokenize(query);

    if (keywords.length === 0) {
        return [];
    }

    const queryLower = query.toLowerCase();

    const results = knowledgeDatabase.map(passage => {

        const content = passage.toLowerCase();
        let score = 0;

        for (const word of keywords) {

            const matches = content.split(word).length - 1;

            if (matches > 0) {
                score += Math.min(matches, 5);
            }
        }

        // Give a small bonus to passages matching the whole query.
        if (content.includes(queryLower)) {
            score += 5;
        }

        // Prefer passages that contain more of the query keywords.
        const matchedWords = keywords.filter(
            word => content.includes(word)
        ).length;

        score += matchedWords * 0.5;

        return {
            passage,
            score,
            matchedWords
        };

    });

    return results
        .filter(item => item.score > 0)
        .sort((a, b) => {
            if (b.score !== a.score) {
                return b.score - a.score;
            }

            return b.matchedWords - a.matchedWords;
        })
        .slice(0, CONFIG.MAX_RESULTS);
}

/* ==================================
   RESPONSE GENERATOR
================================== */

function generateReply(query) {

    const results = searchDatabase(query);

    if (!results.length) {

        return "I couldn't find a matching passage in my GitHub knowledge database.\n\nTry using different keywords or asking about a topic in my database.";
    }

    return results
        .map(item => item.passage)
        .join("\n\n");
}

/* ==================================
   SEND MESSAGE
================================== */

async function sendMessage() {

    const text = input.value.trim();

    if (!text || busy) return;

    if (text.length > CONFIG.MAX_MESSAGE_LENGTH) {
        addMessage(
            "assistant",
            "Please keep your message under " +
            CONFIG.MAX_MESSAGE_LENGTH +
            " characters."
        );
        return;
    }

    addMessage("user", text);

    conversation.push({
        role: "user",
        content: text
    });

    input.value = "";
    input.style.height = "40px";

    busy = true;
    sendButton.disabled = true;

    connection.textContent = "Searching";

    const loading = addMessage(
        "assistant",
        "LEM is searching its knowledge..."
    );

    try {

        if (!knowledgeDatabase) {
            await loadDatabase();
        }

        if (!knowledgeDatabase) {
            throw new Error("Knowledge database unavailable");
        }

        const reply = generateReply(text);

        loading.querySelector(".message-text").textContent = reply;

        conversation.push({
            role: "assistant",
            content: reply
        });

        connection.textContent = "GitHub Connected";

    } catch (error) {

        loading.querySelector(".message-text").textContent =
            "I couldn't access the GitHub knowledge database. Please check your internet connection or try again.";

        connection.textContent = "Database Offline";

        console.error(error);

    } finally {

        busy = false;
        sendButton.disabled = false;
        input.focus();

        chatArea.scrollTop = chatArea.scrollHeight;
    }
}

/* ==================================
   INPUT CONTROLS
================================== */

input.addEventListener("keydown", function(e) {

    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }

});

input.addEventListener("input", function() {

    this.style.height = "40px";

    this.style.height =
        Math.min(this.scrollHeight, 130) + "px";

});

/* ==================================
   SUGGESTIONS
================================== */

function suggest(text) {

    input.value = text;
    sendMessage();
}

/* ==================================
   NEW CHAT
================================== */

function newChat() {

    conversation = [];

    messages.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="welcome-logo">LEM.</div>

            <h1>What can I help you with?</h1>

            <p>
                LEM v2.5 · GitHub Knowledge Assistant
            </p>

            <div class="suggestions">

                <button class="suggestion"
                onclick="suggest('Write me some HTML code')">
                    Create HTML
                </button>

                <button class="suggestion"
                onclick="suggest('Explain how Python works')">
                    Learn Python
                </button>

                <button class="suggestion"
                onclick="suggest('Give me a project idea')">
                    Project ideas
                </button>

            </div>
        </div>
    `;

    connection.textContent = knowledgeDatabase
        ? "GitHub Connected"
        : "Database Offline";
}

/* ==================================
   STARTUP
================================== */

loadDatabase();

</script>

</body>
</html>
