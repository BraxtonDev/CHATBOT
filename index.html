<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LEM AI</title>

<style>
:root {
    --background: #07110d;
    --sidebar: #0b1711;
    --panel: #102219;
    --panel-light: #142b1e;
    --green: #39e58c;
    --green-dark: #1b7045;
    --text: #e9fff1;
    --muted: #8da99a;
    --border: #1d3a2a;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

/* MAIN LAYOUT */

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 255px;
    min-width: 255px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.logo span {
    color: var(--green);
}

.new-chat {
    border: 1px solid var(--green-dark);
    background: var(--panel);
    color: var(--text);
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
}

.new-chat:hover {
    background: var(--panel-light);
}

.sidebar-heading {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 28px;
    margin-bottom: 10px;
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    padding: 10px;
    border-radius: 7px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.history-item:hover {
    background: var(--panel);
    color: var(--text);
}

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 15px;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d69b35;
}

.status-dot.online {
    background: var(--green);
}

.status-dot.offline {
    background: #e35d5d;
}

.settings-button {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
}

.settings-button:hover {
    color: var(--text);
    background: var(--panel);
}

/* MAIN CHAT */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 62px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    flex-shrink: 0;
}

.topbar-title {
    font-weight: bold;
    font-size: 14px;
}

.version {
    color: var(--muted);
    font-size: 12px;
}

/* CHAT AREA */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 18px;
    scroll-behavior: smooth;
}

.chat-inner {
    max-width: 850px;
    margin: auto;
}

/* WELCOME */

.welcome {
    min-height: 65%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px 10px;
}

.welcome-logo {
    font-size: 54px;
    font-weight: bold;
    letter-spacing: 5px;
}

.welcome-logo span {
    color: var(--green);
}

.welcome h1 {
    font-size: 25px;
    margin: 18px 0 8px;
}

.welcome p {
    color: var(--muted);
    max-width: 450px;
    line-height: 1.6;
    font-size: 14px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 550px;
    margin-top: 25px;
}

.suggestion {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px;
    border-radius: 10px;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
}

.suggestion:hover {
    border-color: var(--green-dark);
    background: var(--panel-light);
}

/* MESSAGES */

.message {
    display: flex;
    gap: 12px;
    margin: 22px 0;
    align-items: flex-start;
}

.avatar {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 9px;
    background: var(--panel-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: var(--green);
}

.message.user .avatar {
    background: #23372b;
    color: var(--text);
}

.message-content {
    min-width: 0;
    max-width: 100%;
    line-height: 1.65;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.message-role {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: bold;
}

.message-text {
    white-space: pre-wrap;
}

.message-text pre {
    background: #030906;
    border: 1px solid var(--border);
    padding: 13px;
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre;
}

.message-text code {
    font-family: Consolas, monospace;
}

.typing {
    color: var(--muted);
    font-size: 13px;
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from { opacity: 0.45; }
    to { opacity: 1; }
}

/* INPUT AREA */

.input-area {
    border-top: 1px solid var(--border);
    padding: 17px;
    flex-shrink: 0;
}

.input-inner {
    max-width: 850px;
    margin: auto;
}

.input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 10px;
}

textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    padding: 8px;
    max-height: 150px;
}

textarea::placeholder {
    color: var(--muted);
}

.send-button {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 9px;
    background: var(--green);
    color: #062012;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
}

.send-button:hover {
    background: #6af0a8;
}

.send-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.disclaimer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 10px;
}

/* SETTINGS */

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 10;
}

.modal-overlay.open {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 430px;
    background: var(--sidebar);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
}

.modal h2 {
    margin-top: 0;
    font-size: 19px;
}

.modal label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin: 17px 0 7px;
}

.modal input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--panel);
    color: var(--text);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 20px;
}

.modal-actions button {
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.cancel-button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
}

.save-button {
    background: var(--green);
    border: none;
    color: #062012;
    font-weight: bold;
}

/* MOBILE */

@media(max-width:650px) {

    .sidebar {
        display: none;
    }

    .topbar {
        padding: 0 15px;
    }

    .chat {
        padding: 15px 12px;
    }

    .welcome-logo {
        font-size: 44px;
    }

    .welcome h1 {
        font-size: 21px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }

    .input-area {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <span>LEM</span>
        </div>

        <button class="new-chat" id="newChatButton">
            + New chat
        </button>

        <div class="sidebar-heading">
            Recent chats
        </div>

        <div class="history" id="history"></div>

        <div class="sidebar-bottom">

            <div class="connection">
                <span class="status-dot" id="statusDot"></span>
                <span id="connectionText">Checking connection...</span>
            </div>

            <button class="settings-button" id="settingsButton">
                Settings
            </button>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main">

        <header class="topbar">

            <div class="topbar-title">
                LEM AI
            </div>

            <div class="version">
                LEM · Local model interface
            </div>

        </header>


        <!-- CHAT -->

        <section class="chat" id="chat">

            <div class="chat-inner" id="chatInner">

                <div class="welcome" id="welcome">

                    <div class="welcome-logo">
                        <span>LEM</span>
                    </div>

                    <h1>How can I help?</h1>

                    <p>
                        Start a conversation with LEM.
                        Connect your locally trained model
                        through the Python server.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion" data-prompt="Explain how HTML works.">
                            Explain HTML
                        </button>

                        <button class="suggestion" data-prompt="Write a simple Python program.">
                            Write Python code
                        </button>

                        <button class="suggestion" data-prompt="What is a neural network?">
                            Explain neural networks
                        </button>

                        <button class="suggestion" data-prompt="How does a Transformer language model work?">
                            Explain Transformers
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <footer class="input-area">

            <div class="input-inner">

                <div class="input-box">

                    <textarea
                        id="promptInput"
                        rows="1"
                        placeholder="Message LEM..."
                    ></textarea>

                    <button
                        class="send-button"
                        id="sendButton"
                        title="Send message"
                    >
                        ↑
                    </button>

                </div>

                <div class="disclaimer">
                    LEM is an experimental model. Its responses may be inaccurate.
                </div>

            </div>

        </footer>

    </main>

</div>


<!-- SETTINGS MODAL -->

<div class="modal-overlay" id="settingsModal">

    <div class="modal">

        <h2>LEM settings</h2>

        <label for="endpointInput">
            Python server endpoint
        </label>

        <input
            id="endpointInput"
            type="url"
            value="http://127.0.0.1:8000/generate"
            placeholder="http://127.0.0.1:8000/generate"
        >

        <label for="tokenInput">
            Maximum new tokens
        </label>

        <input
            id="tokenInput"
            type="number"
            min="1"
            max="1000"
            value="200"
        >

        <div class="modal-actions">

            <button class="cancel-button" id="cancelSettings">
                Cancel
            </button>

            <button class="save-button" id="saveSettings">
                Save settings
            </button>

        </div>

    </div>

</div>


<script>

/* --------------------------------------------------
   SETTINGS
-------------------------------------------------- */

const DEFAULT_ENDPOINT = "http://127.0.0.1:8000/generate";

let endpoint = DEFAULT_ENDPOINT;
let maxNewTokens = 200;

let messages = [];
let chatHistory = [];

let isGenerating = false;


/* --------------------------------------------------
   ELEMENTS
-------------------------------------------------- */

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");

const welcome = document.getElementById("welcome");

const promptInput = document.getElementById("promptInput");
const sendButton = document.getElementById("sendButton");

const statusDot = document.getElementById("statusDot");
const connectionText = document.getElementById("connectionText");

const historyElement = document.getElementById("history");

const settingsModal = document.getElementById("settingsModal");
const endpointInput = document.getElementById("endpointInput");
const tokenInput = document.getElementById("tokenInput");


/* --------------------------------------------------
   CONNECTION STATUS
-------------------------------------------------- */

function setConnectionStatus(status, text) {

    statusDot.className = "status-dot";

    if (status === "online") {
        statusDot.classList.add("online");
    }

    if (status === "offline") {
        statusDot.classList.add("offline");
    }

    connectionText.textContent = text;
}


async function checkConnection() {

    setConnectionStatus(
        "checking",
        "Checking model connection..."
    );

    try {

        /*
           This checks the expected server's /health route.
           If your server does not provide /health, the
           interface will still attempt generation when
           the user sends a message.
        */

        const healthURL = endpoint.replace(
            /\/generate\/?$/,
            "/health"
        );

        const response = await fetch(
            healthURL,
            {
                method: "GET"
            }
        );

        if (!response.ok) {
            throw new Error("Health check failed");
        }

        setConnectionStatus(
            "online",
            "Model server connected"
        );

    } catch (error) {

        setConnectionStatus(
            "offline",
            "Model server not detected"
        );

    }

}


/* --------------------------------------------------
   MESSAGE DISPLAY
-------------------------------------------------- */

function addMessage(role, text) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const message = document.createElement("div");

    message.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    avatar.textContent = role === "user" ? "YOU" : "LM";

    const content = document.createElement("div");
    content.className = "message-content";

    const roleLabel = document.createElement("div");
    roleLabel.className = "message-role";

    roleLabel.textContent = role === "user" ? "You" : "LEM";

    const messageText = document.createElement("div");
    messageText.className = "message-text";

    // Use textContent so generated text is displayed safely.
    messageText.textContent = text;

    content.appendChild(roleLabel);
    content.appendChild(messageText);

    message.appendChild(avatar);
    message.appendChild(content);

    chatInner.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}


/* --------------------------------------------------
   TYPING INDICATOR
-------------------------------------------------- */

function addTypingIndicator() {

    const message = document.createElement("div");

    message.className = "message assistant";
    message.id = "typingIndicator";

    message.innerHTML = `
        <div class="avatar">LM</div>
        <div class="message-content">
            <div class="message-role">LEM</div>
            <div class="typing">Generating response...</div>
        </div>
    `;

    chatInner.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}


/* --------------------------------------------------
   CHAT HISTORY
-------------------------------------------------- */

function updateHistory() {

    historyElement.innerHTML = "";

    chatHistory.forEach((item, index) => {

        const element = document.createElement("div");

        element.className = "history-item";

        element.textContent = item.title;

        element.addEventListener("click", () => {
            loadChat(index);
        });

        historyElement.appendChild(element);

    });

}


function saveCurrentChat() {

    if (messages.length === 0) {
        return;
    }

    const firstUserMessage = messages.find(
        message => message.role === "user"
    );

    const title = firstUserMessage
        ? firstUserMessage.content.slice(0, 35)
        : "New chat";

    chatHistory.unshift({
        title: title,
        messages: [...messages]
    });

    if (chatHistory.length > 20) {
        chatHistory.pop();
    }

    updateHistory();

}


function loadChat(index) {

    const selected = chatHistory[index];

    if (!selected) {
        return;
    }

    messages = [...selected.messages];

    chatInner.innerHTML = "";

    messages.forEach(message => {

        addMessage(
            message.role,
            message.content
        );

    });

}


function newChat() {

    saveCurrentChat();

    messages = [];

    chatInner.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="welcome-logo">
                <span>LEM</span>
            </div>

            <h1>How can I help?</h1>

            <p>
                Start a conversation with LEM.
                Connect your locally trained model
                through the Python server.
            </p>

            <div class="suggestions">

                <button class="suggestion" data-prompt="Explain how HTML works.">
                    Explain HTML
                </button>

                <button class="suggestion" data-prompt="Write a simple Python program.">
                    Write Python code
                </button>

                <button class="suggestion" data-prompt="What is a neural network?">
                    Explain neural networks
                </button>

                <button class="suggestion" data-prompt="How does a Transformer language model work?">
                    Explain Transformers
                </button>

            </div>

        </div>
    `;

    attachSuggestionEvents();

}


/* --------------------------------------------------
   SEND MESSAGE TO MODEL
-------------------------------------------------- */

async function sendMessage(text) {

    text = text.trim();

    if (!text || isGenerating) {
        return;
    }

    isGenerating = true;

    sendButton.disabled = true;

    // Display user message.

    addMessage(
        "user",
        text
    );

    messages.push({
        role: "user",
        content: text
    });

    promptInput.value = "";
    promptInput.style.height = "auto";

    const typingIndicator = addTypingIndicator();

    try {

        /*
           Expected Python server request:

           POST /generate

           {
               "prompt": "Hello",
               "max_new_tokens": 200
           }

           Expected response:

           {
               "response": "Hello!..."
           }
        */

        const response = await fetch(
            endpoint,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    prompt: text,
                    max_new_tokens: maxNewTokens
                })
            }
        );

        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " + response.status
            );

        }

        const data = await response.json();

        const answer =
            data.response ??
            data.text ??
            data.generated_text;

        if (typeof answer !== "string") {

            throw new Error(
                "The server response did not contain a response, text, or generated_text string."
            );

        }

        typingIndicator.remove();

        addMessage(
            "assistant",
            answer
        );

        messages.push({
            role: "assistant",
            content: answer
        });

        setConnectionStatus(
            "online",
            "Model server connected"
        );

    } catch (error) {

        typingIndicator.remove();

        addMessage(
            "assistant",
            "I could not reach the LEM model server.\n\n" +
            "Error: " + error.message +
            "\n\nCheck that your Python server is running, " +
            "that the endpoint is correct, and that it allows requests from this page."
        );

        setConnectionStatus(
            "offline",
            "Model server unavailable"
        );

    }

    isGenerating = false;

    sendButton.disabled = false;

    promptInput.focus();

}


/* --------------------------------------------------
   INPUT EVENTS
-------------------------------------------------- */

sendButton.addEventListener("click", () => {

    sendMessage(
        promptInput.value
    );

});


promptInput.addEventListener("keydown", event => {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage(
            promptInput.value
        );

    }

});


promptInput.addEventListener("input", () => {

    promptInput.style.height = "auto";

    promptInput.style.height =
        Math.min(promptInput.scrollHeight, 150) + "px";

});


/* --------------------------------------------------
   SUGGESTION BUTTONS
-------------------------------------------------- */

function attachSuggestionEvents() {

    document.querySelectorAll(".suggestion").forEach(button => {

        button.addEventListener("click", () => {

            sendMessage(
                button.dataset.prompt
            );

        });

    });

}

attachSuggestionEvents();


/* --------------------------------------------------
   NEW CHAT
-------------------------------------------------- */

document.getElementById("newChatButton").addEventListener(
    "click",
    newChat
);


/* --------------------------------------------------
   SETTINGS
-------------------------------------------------- */

document.getElementById("settingsButton").addEventListener(
    "click",
    () => {

        endpointInput.value = endpoint;
        tokenInput.value = maxNewTokens;

        settingsModal.classList.add("open");

    }
);


document.getElementById("cancelSettings").addEventListener(
    "click",
    () => {

        settingsModal.classList.remove("open");

    }
);


document.getElementById("saveSettings").addEventListener(
    "click",
    () => {

        const newEndpoint = endpointInput.value.trim();

        const newTokenCount = Number(tokenInput.value);

        try {

            const parsedURL = new URL(newEndpoint);

            if (
                parsedURL.protocol !== "http:" &&
                parsedURL.protocol !== "https:"
            ) {
                throw new Error("Use an HTTP or HTTPS endpoint.");
            }

        } catch (error) {

            alert("Enter a valid server URL.");

            return;

        }

        if (
            !Number.isInteger(newTokenCount) ||
            newTokenCount < 1 ||
            newTokenCount > 1000
        ) {

            alert("Maximum new tokens must be between 1 and 1000.");

            return;

        }

        endpoint = newEndpoint;

        maxNewTokens = newTokenCount;

        settingsModal.classList.remove("open");

        checkConnection();

    }
);


/* --------------------------------------------------
   STARTUP
-------------------------------------------------- */

checkConnection();

</script>

</body>
</html>
